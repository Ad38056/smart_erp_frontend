<!DOCTYPE html>
<html>

<head>

    <title>Profile</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <div class="top-actions">
        <button class="top-click" onclick="topClick('Profile')">Click</button>
    </div>


    <div class="profile-card">
        <div class="profile-header">
            <img id="avatar" src="assets/logo.png" alt="avatar">
            <div class="profile-info">
                <h1 id="name">User</h1>
                <p id="role">Role</p>
                <p class="email"><strong id="email">user@example.com</strong></p>
            </div>
        </div>

        <div class="profile-actions">
            <button id="btnPullUsers" class="btn">Pull Users</button>
            <button onclick="logout()" class="btn secondary">Logout</button>
        </div>

        <div class="user-list" id="userList" aria-live="polite">
            <!-- Users pulled from API will appear here -->
        </div>
    </div>



    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/profile-users.js"></script>
    <script src="js/top-click.js"></script>

</body>

</html>
