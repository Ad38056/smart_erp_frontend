<!DOCTYPE html>
<html>

<head>

    <title>Products</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/products.css">

</head>


<body>

    <div class="top-actions">
        <button class="top-click" onclick="topClick('Products')">Click</button>
    </div>


    <h1>Product Management</h1>


    <div class="product-form">

        <input id="productName" placeholder="Product Name">

        <input id="productCategory" placeholder="Category">

        <input id="productPrice" type="number" placeholder="Price">

        <input id="productStock" type="number" placeholder="Stock">

        <button onclick="addProduct()">
            Add Product
        </button>

    </div>


    <div id="products"></div>


    <script src="js/auth.js"></script>
    <script src="js/products.js"></script>
    <script src="js/top-click.js"></script>

</body>

</html>
